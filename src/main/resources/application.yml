spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: JournalEntryDB
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: prabhat.kumar@tothenew.com
    password: ${Password}
